<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FXトレンド判定アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>FXトレンド判定アプリ</h1>

    <!-- 現在のレート表示 -->
    <p id="current-rate">現在のレート：取得中...</p>

    <!-- トレンド判定結果 -->
    <p id="trend-direction">トレンド方向：取得中...</p>
    <p id="trend-strength">強度：取得中...</p>
    <p id="warning"></p>

    <!-- ニュース表示 -->
    <h2>最新ニュース</h2>
    <div id="news-area"></div>

    <!-- TradingViewチャート -->
    <div id="tradingview_chart"></div>

    <!-- TradingView読み込み -->
    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
    new TradingView.widget({
      "container_id": "tradingview_chart",
      "symbol": "FX:USDJPY",
      "interval": "5",
      "timezone": "Asia/Tokyo",
      "theme": "light",
      "style": "1",
      "locale": "ja",
      "width": "100%",
      "height": "500"
    });
    </script>

    <!-- あなたの判定ロジック -->
    <script src="app.js"></script>

</body>
</html>
